<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>San Valentín</title>
    <style>
        body {
            background-color: black;
            background-image: url('img/fondo1.png'); /* Reemplaza con la URL correcta */
            background-size: cover;
            background-attachment: fixed;
            color: white;
            text-align: center;
            font-family: "Times New Roman", serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
        }

        .contenedor {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0px 0px 25px rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            transition: transform 0.3s;
        }

            .contenedor:hover {
                transform: scale(1.05);
            }

        .titulo {
            font-size: 36px;
            font-weight: bold;
            text-shadow: 2px 2px 15px rgba(255, 255, 255, 0.7);
            margin-bottom: 20px;
        }

        .botones {
            margin-top: 20px;
        }

        .boton {
            padding: 10px 20px;
            margin: 10px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            box-shadow: 0px 0px 10px rgba(255, 255, 255, 0.7);
            transition: transform 0.2s, box-shadow 0.2s;
        }

            .boton:hover {
                transform: scale(1.1);
                box-shadow: 0px 0px 20px rgba(255, 255, 255, 1);
            }

        .si {
            background-color: #28a745;
            color: white;
        }

        .no {
            background-color: #dc3545;
            color: white;
        }

        /* Estilos para la ventana flotante */
        .modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: rgba(255, 255, 255, 0.95);
            color: black;
            padding: 25px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0px 0px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 10;
        }

            .modal img {
                width: 120px;
                height: auto;
                margin-top: 10px;
                border-radius: 10px;
            }
    </style>
</head>
<body>
    <div class="contenedor">
        <h1 class="titulo">¿Quieres ser mi San Valentín? ❤️</h1>
        <div class="botones">
            <button class="boton si" onclick="window.location.href='Flores.html'">Sí</button>
            <button class="boton no" onclick="mostrarModal();">No</button>
        </div>
    </div>

    <!-- Ventana flotante -->
    <div id="modal" class="modal">
        <p style="font-size: 22px; font-weight: bold;">¡Como que no kre vrga! 😡</p>
        <img src="img/dedo.jpeg">
    </div>

    <script>
        function mostrarModal() {
            var modal = document.getElementById("modal");
            modal.style.display = "block";

            // Ocultar la ventana después de 3 segundos
            setTimeout(function () {
                modal.style.display = "none";
            }, 3000);
        }
    </script>
</body>
</html>
